# Touchless GitOps: Argo CD syncs deploy/k8s plus the VirtualService the cutover
# controller commits for each phase (cutover/gitops.py). Rollback = git revert.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders-cutover
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rupeshkumarbs/zero-downtime-gcp-migration.git
    targetRevision: main
    path: deploy/k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: orders
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
